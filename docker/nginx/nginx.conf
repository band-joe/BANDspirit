# ==============================================================================
# BANDspirit — Nginx Reverse Proxy
# Routing: /odata und /api → C#-Backend (api:8080), Rest → Frontend (frontend:3000)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Gzip-Kompression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate-Limiting-Zone für Auth-Endpunkte ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstreams ───────────────────────────────────────────────────────────────
    upstream bandspirit_api {
        server api:8080;
        keepalive 32;
    }

    upstream bandspirit_app {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health-Endpunkt von Nginx selbst
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── OData-API → Backend ──────────────────────────────────────────────
        location /odata/ {
            proxy_pass http://bandspirit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── NextAuth-Endpunkte → Frontend ────────────────────────────────────
        # WICHTIG: NextAuth lebt im Next.js-Frontend, NICHT im C#-Backend.
        # Diese reservierten NextAuth-Pfade MÜSSEN zum Frontend geroutet werden.
        # (csrf, callback/*, session, providers, signin, signout, error, _log)
        # Regex-Locations werden vor Prefix-Locations ausgewertet, daher fängt
        # dieser Block die NextAuth-Pfade ab, bevor "/api/auth/" (Backend) greift.
        # KEIN Rate-Limit hier — NextAuth pollt die Session regelmässig, ein
        # Limit würde zu 503-Fehlern führen.
        location ~ ^/api/auth/(csrf|callback|session|providers|signin|signout|error|_log|verify-request) {
            proxy_pass http://bandspirit_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Backend-Auth-Endpunkte (mit Rate-Limit) → Backend ────────────────
        # login, signup, entra-callback, forgot-password, reset-password.
        # burst=10 lässt kurze Spitzen zu, ohne 503 beim normalen Ablauf.
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://bandspirit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Übrige API → Backend ─────────────────────────────────────────────
        location /api/ {
            proxy_pass http://bandspirit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Backend-Health ────────────────────────────────────────────────────
        location /health {
            proxy_pass http://bandspirit_api;
            proxy_set_header Host $host;
        }

        # ── Statische Next.js-Assets (langes Caching) → Frontend ─────────────
        location /_next/static/ {
            proxy_pass http://bandspirit_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Alles Übrige → Frontend ──────────────────────────────────────────
        location / {
            proxy_pass http://bandspirit_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
