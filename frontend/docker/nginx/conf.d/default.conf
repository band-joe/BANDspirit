# ==============================================================================
# BANDspirit — Nginx Server-Block (HTTP)
# ==============================================================================
# Für HTTPS: SSL-Zertifikat in docker/nginx/ssl/ ablegen und
# den auskommentierten HTTPS-Block aktivieren.
# ==============================================================================

# ── HTTP-Server ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ── Statische Assets — langfristiges Caching ──────────────────────────
    location /_next/static/ {
        proxy_pass http://bandspirit_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        proxy_pass http://bandspirit_app;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Auth-Endpunkte — striktes Rate-Limiting ───────────────────────────
    location /api/auth/forgot-password {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://bandspirit_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    location /api/auth/reset-password {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://bandspirit_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    location /api/auth/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://bandspirit_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ── API-Endpunkte — moderates Rate-Limiting ───────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://bandspirit_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ── Alles andere — App-Seiten ─────────────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://bandspirit_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ── Health-Check für Nginx selbst ─────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Fehlerseiten ──────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

