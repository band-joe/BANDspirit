# ==============================================================================
# BANDspirit V2 — Docker Compose
# Services: nginx (Reverse Proxy) + frontend (Next.js) + api (C#/.NET 8)
#           + postgres (PostgreSQL 16) + redis (Redis 7) + minio
# ==============================================================================
# Verwendung:
#   1. Platzhalter (PLACEHOLDER) durch echte Werte ersetzen bzw. .env pflegen
#   2. docker compose up -d --build
# ==============================================================================

services:
  # ── Nginx — Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: bandspirit-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - bandspirit-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend — Next.js ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bandspirit-frontend
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_BASE_URL=${API_BASE_URL}
      - NEXT_PUBLIC_S3_BASE_URL=${NEXT_PUBLIC_S3_BASE_URL}
      - AZURE_AD_CLIENT_ID=${ENTRA_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${ENTRA_TENANT_ID}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bandspirit-net

  # ── API — C# / ASP.NET Core 8 ────────────────────────────────────────────────
  api:
    build:
      context: ./backend/BandSpirit.Api
      dockerfile: Dockerfile
    container_name: bandspirit-api
    restart: unless-stopped
    expose:
      - '8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      # ── Datenbank ──
      - ConnectionStrings__Default=${CONNECTION_STRING}
      # ── JWT ──
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__ExpiresHours=8
      - DefaultAdminPassword=${DEFAULT_ADMIN_PASSWORD}
      # ── Redis ──
      - Redis__ConnectionString=redis:6379
      # ── Entra ID (Azure AD) ──
      - AzureAd__ClientId=${ENTRA_CLIENT_ID}
      - AzureAd__TenantId=${ENTRA_TENANT_ID}
      - AzureAd__ClientSecret=${ENTRA_CLIENT_SECRET}
      - AzureAd__Enabled=${ENTRA_ENABLED}
      # ── MinIO (S3-kompatibel, On-Premise) ──
      - S3__ServiceUrl=http://minio:9000
      - S3__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - S3__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3__BucketName=${S3_BUCKET_NAME:-bandspirit}
      - S3__Region=us-east-1
      - S3__ForcePathStyle=true
      # ── SMTP E-Mail-Versand (Microsoft Exchange / interner Relay) ──
      # WICHTIG: .env verwendet die EXCHANGE_SMTP_*-Namen (siehe .env.example).
      # Zuvor las dieser Block abweichende SMTP_*-Variablen, die in .env nie
      # gesetzt waren -> Backend nutzte immer den mail.band.local-Fallback,
      # E-Mail-Versand schlug still fehl (Fehler wird nur geloggt, siehe
      # NotificationService.SendEmailAsync / AuthController.ForgotPassword).
      - Smtp__Host=${EXCHANGE_SMTP_HOST:-mail.band.local}
      - Smtp__Port=${EXCHANGE_SMTP_PORT:-587}
      # Security: None (Port 25 intern) | StartTls (587, z. B. Office 365) | SslOnConnect (465) | Auto
      - Smtp__Security=${SMTP_SECURITY:-StartTls}
      # Auth optional – leer lassen, wenn der Relay ohne Anmeldung annimmt
      - Smtp__User=${EXCHANGE_SMTP_USER:-}
      - Smtp__Password=${EXCHANGE_SMTP_PASSWORD:-}
      - Smtp__FromEmail=${EXCHANGE_FROM_EMAIL:-noreply@band.ch}
      - Smtp__FromName=${EXCHANGE_FROM_NAME:-BANDspirit}
      - Smtp__AdminEmail=${EXCHANGE_ADMIN_EMAIL:-admin@band.ch}
      - App__BaseUrl=${NEXTAUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bandspirit-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bandspirit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Collation de_CH.UTF-8 für die Erstinitialisierung
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=de_CH.UTF-8 --lc-ctype=de_CH.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bandspirit-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bandspirit -d bandspirit']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command:
      - 'postgres'
      - '-c'
      - 'log_timezone=Europe/Zurich'
      - '-c'
      - 'timezone=Europe/Zurich'

  # ── Redis 7 ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bandspirit-redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    networks:
      - bandspirit-net
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --save 60 1000
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── MinIO — On-Premise S3-kompatible Object Storage ─────────────────────────
  minio:
    # minio/minio auf Docker Hub verlangt seit 2024 für ALLE Tags eine
    # Authentifizierung (anonymer Pull -> 401/"pull access denied").
    # quay.io/minio/minio ist der offizielle, weiterhin frei erreichbare Spiegel.
    image: quay.io/minio/minio:latest
    container_name: bandspirit-minio
    restart: unless-stopped
    ports:
      - '9000:9000'   # S3 API
      - '9011:9001'   # MinIO Console (Web UI) — Port 9001 → 9011 (Konflikt vermeiden)
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - bandspirit-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  nginx-logs:
    driver: local

# ── Netzwerk ───────────────────────────────────────────────────────────────────
networks:
  bandspirit-net:
    driver: bridge
    name: bandspirit-network
